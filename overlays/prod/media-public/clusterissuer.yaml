apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-anyproject
spec:
  acme:
    email: lightstone1@naver.com
    privateKeySecretRef:
      name: letsencrypt-anyproject-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - selector:
        dnsZones:
        - anyproject.dev
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-anyproject
            key: api-token
