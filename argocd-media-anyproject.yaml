apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-anyproject
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/taeboranger/v-gallery-config.git
    targetRevision: main
    path: overlays/prod/media-public
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
